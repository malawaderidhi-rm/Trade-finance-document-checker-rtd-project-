version: "3.9"

services:
  api:
    build: .
    container_name: trade-finance-api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - GROQ_MODEL=meta-llama/llama-4-maverick-17b-128e-instruct
    volumes:
      - .:/app
